[project]
name = "poker-analysis"
version = "0.1.0"
description = "Determine the best 5-card poker hand from 7 cards"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
