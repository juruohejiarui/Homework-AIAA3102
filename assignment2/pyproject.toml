[project]
name = "plant-pathology-assignment"
version = "0.1.0"
description = "Starter code for Assignment 2"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pillow>=10.4,<12",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_pathology"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
